<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · Charbel Kinkpe</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/admin.css">
  <script type="module" src="/js/admin/app.js"></script>
</head>

<body>

  <main class="login" id="login" hidden>
    <form class="card" id="login-form" novalidate>
      <span class="logo">CK<span>.</span></span>
      <h1>Espace admin</h1>
      <p class="muted">Connecte-toi pour modifier le contenu du portfolio.</p>
      <label>E-mail
        <input type="email" name="email" autocomplete="username" required>
      </label>
      <label>Mot de passe
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p class="error" id="login-error" role="alert" hidden></p>
      <button class="btn primary" type="submit">Se connecter</button>
    </form>
    <a class="back" href="/">← Retour au site</a>
  </main>

  <div class="app" id="app" hidden>
    <aside class="side" id="side">
      <div class="side-top">
        <span class="logo">CK<span>.</span> <small>admin</small></span>
        <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="side-menu"
          aria-label="Ouvrir le menu"><span></span></button>
      </div>
      <div class="side-menu" id="side-menu">
        <nav id="sections" aria-label="Sections"></nav>
        <div class="who">
          <span id="who"></span>
          <a class="btn small" href="/" target="_blank" rel="noopener">Voir le site ↗</a>
          <button class="btn small" id="logout" type="button">Se déconnecter</button>
        </div>
      </div>
    </aside>
    <main class="main">
      <header class="main-head">
        <h1 id="section-title"></h1>
      </header>
      <div id="section-body"></div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <dialog class="dialog" id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-text">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button class="btn" value="cancel" autofocus>Annuler</button>
        <button class="btn primary" value="ok" id="confirm-ok"></button>
      </div>
    </form>
  </dialog>

</body>

</html>
